<svg width="1200" height="520" viewBox="0 0 1200 520"
xmlns="http://www.w3.org/2000/svg"
role="img"
aria-labelledby="title desc">

<title id="title">KYARA HIGH-TECH v1 — System Online</title>
<desc id="desc">KYARA High-Tech futuristic system monitor.</desc>

<defs>

<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
<path d="M48 0H0V48"
fill="none"
stroke="#ffffff"
stroke-opacity=".07"/>
</pattern>

<linearGradient id="line" x1="0" x2="1">
<stop offset="0" stop-color="#fff" stop-opacity="0"/>
<stop offset=".5" stop-color="#fff" stop-opacity=".9"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>

<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#fff"/>
<stop offset=".45" stop-color="#888"/>
<stop offset=".7" stop-color="#fff"/>
<stop offset="1" stop-color="#777"/>
</linearGradient>

<filter id="glow"
x="-100%" y="-100%"
width="300%" height="300%">

<feGaussianBlur
stdDeviation="4"
result="blur"/>

<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>

</filter>

<filter id="strongGlow"
x="-100%" y="-100%"
width="300%" height="300%">

<feGaussianBlur
stdDeviation="8"
result="blur"/>

<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>

</filter>

<style>

.mono {
font-family:"Courier New",Courier,monospace;
}

.title {
font-family:"Courier New",Courier,monospace;
font-weight:700;
letter-spacing:10px;
}

.pulse {
animation:pulse 2.2s ease-in-out infinite;
}

.blink {
animation:blink 1.8s ease-in-out infinite;
}

.blink2 {
animation:blink 1.8s ease-in-out .6s infinite;
}

.load {
transform-origin:left center;
animation:load 3s ease-in-out infinite;
}

.load2 {
transform-origin:left center;
animation:load 3s ease-in-out .4s infinite;
}

.load3 {
transform-origin:left center;
animation:load 3s ease-in-out .8s infinite;
}

.load4 {
transform-origin:left center;
animation:load 3s ease-in-out 1.2s infinite;
}

.scan {
animation:scan 4s linear infinite;
}

.logo {
animation:logoPulse 3s ease-in-out infinite;
}

.glitch {
animation:glitch 5s steps(1) infinite;
}

@keyframes pulse {

0%,100% {
opacity:.35;
}

50% {
opacity:1;
}

}

@keyframes blink {

0%,100% {
opacity:.25;
}

50% {
opacity:1;
}

}

@keyframes load {

0% {
transform:scaleX(.35);
opacity:.35;
}

50% {
transform:scaleX(1);
opacity:1;
}

100% {
transform:scaleX(.35);
opacity:.35;
}

}

@keyframes scan {

0% {
transform:translateY(-120px);
opacity:0;
}

15% {
opacity:.65;
}

75% {
opacity:.65;
}

100% {
transform:translateY(560px);
opacity:0;
}

}

@keyframes logoPulse {

0%,100% {
opacity:.7;
}

50% {
opacity:1;
}

}

@keyframes glitch {

0%,90%,100% {
transform:translateX(0);
}

92% {
transform:translateX(-2px);
}

94% {
transform:translateX(2px);
}

96% {
transform:translateX(-1px);
}

}

</style>

</defs>


