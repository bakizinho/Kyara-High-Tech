<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>KYARA TUBE</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;background:#0f0f0f;color:#fff;
 font-family:Arial,Helvetica,sans-serif
}
body{padding-bottom:70px}

header{
 position:sticky;top:0;z-index:50;
 height:64px;background:#0f0f0ff5;
 backdrop-filter:blur(12px);
 display:flex;align-items:center;
 gap:18px;padding:8px 18px;
 border-bottom:1px solid #272727
}

.logo{
 font-weight:900;font-size:21px;
 white-space:nowrap
}
.logo span{color:#ff0033}

.search{
 flex:1;display:flex;
 max-width:720px;margin:auto
}
.search input{
 flex:1;height:42px;
 background:#121212;
 border:1px solid #303030;
 border-radius:22px 0 0 22px;
 color:#fff;padding:0 18px;
 font-size:15px;outline:none
}
.search button{
 width:58px;border:1px solid #303030;
 border-left:0;background:#222;
 color:#fff;border-radius:0 22px 22px 0;
 font-size:19px
}

main{max-width:1500px;margin:auto;padding:16px}

.chips{
 display:flex;gap:10px;
 overflow-x:auto;padding-bottom:15px
}
.chips button{
 border:0;background:#272727;color:#fff;
 padding:9px 16px;border-radius:9px;
 white-space:nowrap
}
.chips button.active{
 background:#fff;color:#111
}

#player{
 display:none;
 background:#000;
 margin:-16px -16px 22px
}
#player iframe{
 width:100%;
 aspect-ratio:16/9;
 border:0;display:block
}
.player-body{
 padding:14px 16px;
 background:#181818
}
.player-title{
 font-size:19px;font-weight:700;
 line-height:1.35
}
.player-channel{
 color:#aaa;margin-top:7px;font-size:14px
}
.player-actions{
 display:flex;gap:8px;
 overflow:auto;margin-top:13px
}
.player-actions button{
 border:0;background:#272727;
 color:#fff;padding:9px 15px;
 border-radius:18px;white-space:nowrap
}

.section-title{
 font-size:20px;font-weight:700;
 margin:12px 0
}

.grid{
 display:grid;
 grid-template-columns:
 repeat(auto-fill,minmax(260px,1fr));
 gap:28px 17px
}

.card{cursor:pointer;min-width:0}
.thumb{
 position:relative;
 aspect-ratio:16/9;
 background:#222;
 border-radius:10px;
 overflow:hidden
}
.thumb img{
 width:100%;height:100%;
 object-fit:cover;display:block
}
.duration{
 position:absolute;right:7px;bottom:7px;
 background:#000d;
 padding:3px 5px;
 border-radius:4px;font-size:12px
}

.meta{
 display:flex;gap:10px;padding-top:10px
}
.avatar{
 width:38px;height:38px;
 border-radius:50%;
 background:#303030;
 flex:none
}
.info{min-width:0}
.title{
 font-size:15px;
 font-weight:600;
 line-height:1.35;
 display:-webkit-box;
 -webkit-line-clamp:2;
 -webkit-box-orient:vertical;
 overflow:hidden
}
.channel{
 color:#aaa;font-size:13px;
 margin-top:6px
}
.views{
 color:#777;font-size:12px;
 margin-top:3px
}

.loading{
 text-align:center;
 color:#aaa;
 padding:70px 20px
}
.empty{
 text-align:center;
 color:#888;
 padding:70px 20px
}

nav{
 position:fixed;bottom:0;left:0;right:0;
 z-index:100;height:64px;
 display:flex;
 background:#0f0f0ff7;
 backdrop-filter:blur(15px);
 border-top:1px solid #292929
}
nav button{
 flex:1;border:0;background:none;
 color:#aaa;font-size:11px
}
nav button b{
 display:block;font-size:21px;
 margin-bottom:3px
}
nav button.active{color:#fff}

@media(max-width:650px){
 header{
  height:56px;padding:7px 10px;gap:9px
 }
 .logo{font-size:17px}
 .search input{
  height:38px;font-size:14px
 }
 .search button{
  width:45px
 }
 main{padding:12px 10px}
 #player{margin:-12px -10px 18px}
 .grid{
  display:block
 }
 .card{margin-bottom:24px}
 .thumb{border-radius:8px}
 .section-title{font-size:18px}
}
</style>
</head>

<body>

<header>
 <div class="logo">KYARA<span>TUBE</span></div>

 <form class="search" id="searchForm">
  <input
   id="query"
   autocomplete="off"
   placeholder="Pesquisar"
  >
  <button type="submit">⌕</button>
 </form>
</header>

<main>

 <div class="chips" id="chips">
  <button class="active" data-q="músicas mais tocadas">Tudo</button>
  <button data-q="música">Música</button>
  <button data-q="games">Games</button>
  <button data-q="minecraft">Minecraft</button>
  <button data-q="notícias">Notícias</button>
  <button data-q="filmes">Filmes</button>
  <button data-q="futebol">Futebol</button>
 </div>

 <section id="player">

  <iframe
   id="frame"
   allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share"
   allowfullscreen>
  </iframe>

  <div class="player-body">
   <div class="player-title" id="playerTitle"></div>
   <div class="player-channel" id="playerChannel"></div>

   <div class="player-actions">
    <button id="likeBtn">👍 Curtir</button>
    <button id="shareBtn">↗ Compartilhar</button>
    <button id="closeBtn">✕ Fechar</button>
   </div>
  </div>

 </section>

 <div class="section-title" id="sectionTitle">
  Recomendações
 </div>

 <section id="content">
  <div class="loading">Carregando vídeos...</div>
 </section>

</main>

<nav>
 <button id="homeBtn" class="active">
  <b>⌂</b>Início
 </button>

 <button id="shortsBtn">
  <b>▶</b>Shorts
 </button>

 <button id="historyBtn">
  <b>◷</b>Histórico
 </button>

 <button id="savedBtn">
  <b>♡</b>Você
 </button>
</nav>

<script>
const API="/api/browser/search";

const content=document.getElementById("content");
const query=document.getElementById("query");
const player=document.getElementById("player");
const frame=document.getElementById("frame");
const playerTitle=document.getElementById("playerTitle");
const playerChannel=document.getElementById("playerChannel");
const sectionTitle=document.getElementById("sectionTitle");

let currentItems=[];

function esc(s){
 return String(s||"").replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[m]));
}

function thumb(v){
 const id=v.id||v.videoId||"";
 return v.thumbnail ||
  v.thumb ||
  "https://i.ytimg.com/vi/"+encodeURIComponent(id)+"/hqdefault.jpg";
}

function normalize(data){
 if(Array.isArray(data))return data;

 return data.results ||
        data.resultados ||
        data.items ||
        data.videos ||
        [];
}

function render(items,title){
 currentItems=items||[];

 sectionTitle.textContent=
  title||"Recomendações";

 if(!currentItems.length){
  content.innerHTML=
   '<div class="empty">Nenhum vídeo encontrado.</div>';
  return;
 }

 content.innerHTML=
  '<div class="grid">'+
  currentItems.map((v,i)=>{

   const id=v.id||v.videoId||"";
   const t=v.title||v.name||"Vídeo";
   const channel=
    v.channel||v.author||v.uploader||"YouTube";

   return `
    <article class="card"
      data-id="${esc(id)}"
      data-title="${esc(t)}"
      data-channel="${esc(channel)}">

      <div class="thumb">
       <img
        loading="lazy"
        src="${esc(thumb(v))}"
        onerror="this.src='https://i.ytimg.com/vi/${encodeURIComponent(id)}/mqdefault.jpg'">

       ${
        v.duration||v.seconds
        ? `<span class="duration">${
            esc(v.duration||formatTime(v.seconds))
          }</span>`
        :""
       }
      </div>

      <div class="meta">

       <div class="avatar"></div>

       <div class="info">

        <div class="title">
         ${esc(t)}
        </div>

        <div class="channel">
         ${esc(channel)}
        </div>

        <div class="views">
         ${esc(v.views||"")}
        </div>

       </div>
      </div>
    </article>
   `;
  }).join("")+
  "</div>";

 document.querySelectorAll(".card").forEach(card=>{
  card.addEventListener("click",()=>{
   play(
    card.dataset.id,
    card.dataset.title,
    card.dataset.channel
   );
  });
 });
}

function formatTime(sec){
 sec=Math.floor(Number(sec)||0);
 if(!sec)return "";
 const m=Math.floor(sec/60);
 const s=String(sec%60).padStart(2,"0");
 return m+":"+s;
}

function play(id,title,channel){

 if(!id)return;

 player.style.display="block";

 frame.src=
  "https://www.youtube.com/embed/"+
  encodeURIComponent(id)+
  "?autoplay=1&rel=0&modestbranding=1";

 playerTitle.textContent=title||"";
 playerChannel.textContent=channel||"";

 localStorage.setItem(
  "kyara.lastVideo",
  JSON.stringify({
   id:id,
   title:title,
   channel:channel,
   time:Date.now()
  })
 );

 let history=
  JSON.parse(
   localStorage.getItem("kyara.history")||"[]"
  );

 history=history.filter(x=>x.id!==id);

 history.unshift({
  id,title,channel
 });

 history=history.slice(0,50);

 localStorage.setItem(
  "kyara.history",
  JSON.stringify(history)
 );

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });
}

function closePlayer(){
 player.style.display="none";
 frame.src="";
}

async function search(q,title){

 q=(q||"").trim();

 if(!q)return;

 content.innerHTML=
  '<div class="loading">🔎 Pesquisando no YouTube...</div>';

 try{

  const response=
   await fetch(
    API+"?q="+encodeURIComponent(q)
   );

  if(!response.ok)
   throw new Error(
    "HTTP "+response.status
   );

  const data=
   await response.json();

  if(data.status===false)
   throw new Error(
    data.error||"Erro na API"
   );

  const items=normalize(data);

  render(
   items,
   title||"Resultados para "+q
  );

 }catch(error){

  content.innerHTML=
   '<div class="empty">'+
   'Não foi possível carregar os vídeos.<br><br>'+
   '<small>'+esc(error.message)+'</small>'+
   '</div>';
 }
}

document
 .getElementById("searchForm")
 .addEventListener("submit",e=>{
  e.preventDefault();

  const q=query.value.trim();

  if(q)
   search(q,"Resultados para "+q);
 });

document
 .getElementById("closeBtn")
 .onclick=closePlayer;

document
 .getElementById("shareBtn")
 .onclick=async()=>{

  const url=frame.src;

  try{
   await navigator.clipboard.writeText(url);
   alert("Link copiado.");
  }catch{
   prompt("Copie o link:",url);
  }
 };

document
 .getElementById("likeBtn")
 .onclick=function(){

  this.textContent=
   this.textContent.includes("Curtido")
   ?"👍 Curtir"
   :"👍 Curtido";
 };

document
 .querySelectorAll("#chips button")
 .forEach(btn=>{

  btn.addEventListener("click",()=>{

   document
    .querySelectorAll("#chips button")
    .forEach(x=>
     x.classList.remove("active")
    );

   btn.classList.add("active");

   const q=btn.dataset.q;

   query.value=q;

   search(q,btn.textContent);
  });
 });

document
 .getElementById("homeBtn")
 .onclick=()=>{

  closePlayer();

  document
   .querySelectorAll("nav button")
   .forEach(x=>
    x.classList.remove("active")
   );

  document
   .getElementById("homeBtn")
   .classList.add("active");

  search("músicas mais tocadas","Início");
 };

document
 .getElementById("shortsBtn")
 .onclick=()=>{

  search(
   "YouTube Shorts",
   "Shorts"
  );
 };

document
 .getElementById("historyBtn")
 .onclick=()=>{

  document
   .querySelectorAll("nav button")
   .forEach(x=>
    x.classList.remove("active")
   );

  document
   .getElementById("historyBtn")
   .classList.add("active");

  const history=
   JSON.parse(
    localStorage.getItem("kyara.history")||"[]"
   );

  render(history,"Histórico");
 };

document
 .getElementById("savedBtn")
 .onclick=()=>{

  document
   .querySelectorAll("nav button")
   .forEach(x=>
    x.classList.remove("active")
   );

  document
   .getElementById("savedBtn")
   .classList.add("active");

  content.innerHTML=
   '<div class="empty">'+
   'Seus vídeos salvos aparecerão aqui.'+
   '</div>';
 };

const params=
 new URLSearchParams(location.search);

const initial=
 params.get("q");

if(initial){

 query.value=initial;

 search(
  initial,
  "Resultados para "+initial
 );

}else{

 search(
  "músicas mais tocadas",
  "Início"
 );
}
</script>

</body>
</html>
