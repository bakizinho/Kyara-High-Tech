<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Kyara Tube</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#0f0f0f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#0f0f0f;
    border-bottom:1px solid #272727;
    padding:12px;
}

.top{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    font-size:22px;
    font-weight:bold;
    white-space:nowrap;
}

.logo span{
    color:#ff0033;
}

.search{
    flex:1;
    display:flex;
    background:#181818;
    border:1px solid #303030;
    border-radius:24px;
    overflow:hidden;
}

.search input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:12px 16px;
    font-size:15px;
}

.search button{
    width:50px;
    border:0;
    background:#272727;
    color:white;
    font-size:19px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.player{
    display:none;
    background:#000;
}

.player video{
    width:100%;
    max-height:600px;
    display:block;
    background:#000;
}

.player iframe{
    width:100%;
    aspect-ratio:16/9;
    border:0;
}

.player-info{
    padding:15px;
    background:#181818;
}

.player-title{
    font-size:18px;
    font-weight:bold;
    line-height:1.35;
}

.player-meta{
    color:#aaa;
    margin-top:7px;
    font-size:13px;
}

.close{
    margin-top:12px;
    background:#303030;
    border:0;
    color:white;
    padding:9px 15px;
    border-radius:20px;
}

.controls{
    display:flex;
    gap:8px;
    padding:12px;
    overflow-x:auto;
    border-bottom:1px solid #222;
}

.filter{
    white-space:nowrap;
    background:#272727;
    color:white;
    border:0;
    padding:9px 15px;
    border-radius:18px;
}

.filter.active{
    background:white;
    color:black;
}

.results{
    padding:12px;
}

.status{
    padding:15px;
    text-align:center;
    color:#aaa;
}

.card{
    display:flex;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid #252525;
    cursor:pointer;
}

.thumb{
    position:relative;
    flex:0 0 42%;
    max-width:320px;
}

.thumb img{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    border-radius:8px;
    display:block;
}

.duration{
    position:absolute;
    right:5px;
    bottom:5px;
    background:rgba(0,0,0,.85);
    padding:3px 5px;
    border-radius:4px;
    font-size:11px;
}

.info{
    flex:1;
    min-width:0;
}

.title{
    font-size:15px;
    font-weight:bold;
    line-height:1.35;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.channel{
    color:#aaa;
    font-size:13px;
    margin-top:8px;
}

.views{
    color:#777;
    font-size:12px;
    margin-top:4px;
}

.actions{
    display:flex;
    gap:6px;
    margin-top:10px;
    flex-wrap:wrap;
}

.action{
    border:0;
    border-radius:16px;
    padding:7px 11px;
    font-size:12px;
    color:white;
    background:#272727;
}

.action.audio{
    background:#173d2c;
}

.action.video{
    background:#3d2025;
}

.action:hover{
    filter:brightness(1.3);
}

.channel-box{
    display:none;
    padding:15px;
    border-bottom:1px solid #272727;
}

.channel-header{
    display:flex;
    align-items:center;
    gap:15px;
}

.channel-avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#272727;
    object-fit:cover;
}

.channel-name{
    font-size:20px;
    font-weight:bold;
}

.verified{
    color:#4da6ff;
}

.channel-description{
    color:#aaa;
    font-size:13px;
    margin-top:5px;
}

.download{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    z-index:999;
    display:none;
    width:min(92%,500px);
    background:#181818;
    border:1px solid #333;
    border-radius:15px;
    padding:15px;
    box-shadow:0 10px 40px rgba(0,0,0,.6);
}

.download-title{
    font-weight:bold;
}

.progress{
    height:6px;
    background:#333;
    border-radius:10px;
    margin-top:10px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#ff0033;
    transition:.3s;
}

.download-text{
    color:#aaa;
    font-size:12px;
    margin-top:7px;
}

.empty{
    padding:50px 20px;
    text-align:center;
    color:#777;
}

@media(max-width:650px){

    .logo{
        display:none;
    }

    .card{
        display:block;
    }

    .thumb{
        max-width:none;
        width:100%;
    }

    .info{
        padding-top:8px;
    }

    .title{
        font-size:15px;
    }

    .actions{
        margin-bottom:5px;
    }
}
</style>
</head>

<body>

<header>
<div class="container">
<div class="top">

<div class="logo">
▶ <span>Kyara</span> Tube
</div>

<div class="search">
<input
id="searchInput"
type="search"
placeholder="Pesquisar no Kyara Tube..."
autocomplete="off"
>

<button onclick="search()">🔎</button>
</div>

</div>
</div>
</header>

<div class="container">

<div id="player" class="player">

<iframe
id="iframe"
allow="autoplay; encrypted-media; picture-in-picture"
allowfullscreen>
</iframe>

<div class="player-info">

<div id="playerTitle" class="player-title"></div>

<div id="playerMeta" class="player-meta"></div>

<button class="close" onclick="closePlayer()">
✕ Fechar player
</button>

</div>

</div>

<div class="controls">

<button class="filter active" onclick="showHome()">
🏠 Início
</button>

<button class="filter" onclick="showTrending()">
🔥 Em alta
</button>

<button class="filter" onclick="showHistory()">
🕘 Histórico
</button>

</div>

<div id="channelBox" class="channel-box"></div>

<main id="results">

<div class="empty">
<div style="font-size:50px">▶️</div>
<h2>Kyara Tube</h2>
<p style="margin-top:8px">
Pesquise um vídeo para começar
</p>
</div>

</main>

</div>

<div id="download" class="download">

<div id="downloadTitle" class="download-title">
Preparando download...
</div>

<div class="progress">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="downloadText" class="download-text">
Aguardando...
</div>

</div>

<script>

/* =========================================================
   KYARA TUBE
========================================================= */

const API_BASE = "http://192.168.1.6:3000";

const API_SEARCH =
    API_BASE + "/api/browser/search";

const API_EMBED =
    API_BASE + "/api/browser/embed";

const API_DOWNLOAD =
    API_BASE + "/api/browser/download";

const API_CHANNEL =
    API_BASE + "/api/browser/channel";

const API_CHANNEL_SEARCH =
    API_BASE + "/api/browser/channel/search";

let currentResults = [];

const $ = id => document.getElementById(id);


/* =========================================================
   ESCAPE
========================================================= */

function esc(value){

    if(value === undefined || value === null)
        return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   FORMAT
========================================================= */

function formatViews(value){

    if(value === undefined || value === null)
        return "";

    if(typeof value === "number"){

        if(value >= 1000000)
            return (value/1000000).toFixed(1) + " mi visualizações";

        if(value >= 1000)
            return (value/1000).toFixed(1) + " mil visualizações";

        return value + " visualizações";
    }

    return value;
}


/* =========================================================
   SEARCH
========================================================= */

async function search(){

    const input = $("searchInput");

    const query = input.value.trim();

    if(!query)
        return;

    $("channelBox").style.display = "none";

    $("results").innerHTML = `
        <div class="status">
            🔎 Pesquisando <b>${esc(query)}</b>...
        </div>
    `;

    try{

        const response = await fetch(API_SEARCH,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                siteUrl:"https://www.youtube.com",

                query:query

            })

        });

        const data = await response.json();

        if(!data.status)
            throw new Error(data.message || "Erro na pesquisa");

        currentResults = data.results || [];

        renderResults(currentResults);

    }catch(error){

        console.error(error);

        $("results").innerHTML = `
            <div class="empty">

                ❌ Não foi possível pesquisar.

                <br><br>

                <small>${esc(error.message)}</small>

            </div>
        `;
    }
}


/* =========================================================
   RENDER
========================================================= */

function renderResults(results){

    if(!results.length){

        $("results").innerHTML = `
            <div class="empty">
                😕 Nenhum resultado encontrado.
            </div>
        `;

        return;
    }

    $("results").innerHTML = results.map((item,index)=>{

        const title =
            item.title ||
            item.name ||
            "Sem título";

        const url =
            item.url ||
            item.link ||
            "";

        const thumbnail =
            item.thumbnail ||
            item.image ||
            "";

        const author =
            item.author ||
            item.channel ||
            item.uploader ||
            "YouTube";

        const duration =
            item.duration ||
            "";

        const views =
            formatViews(item.views);

        return `

        <article class="card">

            <div
                class="thumb"
                onclick="play(${index})"
            >

                <img
                    src="${esc(thumbnail)}"
                    loading="lazy"
                    onerror="this.style.display='none'"
                >

                ${
                    duration
                    ?
                    `<span class="duration">
                        ${esc(duration)}
                    </span>`
                    :
                    ""
                }

            </div>

            <div class="info">

                <div
                    class="title"
                    onclick="play(${index})"
                >
                    ${esc(title)}
                </div>

                <div class="channel">
                    ${esc(author)}
                </div>

                ${
                    views
                    ?
                    `<div class="views">
                        ${esc(views)}
                    </div>`
                    :
                    ""
                }

                <div class="actions">

                    <button
                        class="action"
                        onclick="play(${index})"
                    >
                        ▶ Assistir
                    </button>

                    <button
                        class="action audio"
                        onclick="downloadMedia(${index},'audio')"
                    >
                        🎵 MP3
                    </button>

                    <button
                        class="action video"
                        onclick="downloadMedia(${index},'video')"
                    >
                        🎬 MP4
                    </button>

                </div>

            </div>

        </article>

        `;

    }).join("");
}


/* =========================================================
   PLAYER
========================================================= */

async function play(index){

    const item = currentResults[index];

    if(!item)
        return;

    const url =
        item.url ||
        item.link;

    if(!url)
        return;

    const title =
        item.title ||
        "Kyara Tube";

    $("player").style.display = "block";

    $("playerTitle").textContent = title;

    $("playerMeta").textContent =
        item.author ||
        item.channel ||
        "YouTube";

    $("iframe").src =
        "https://www.youtube.com/embed/" +
        extractVideoId(url) +
        "?autoplay=1&rel=0";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

    saveHistory(item);
}


/* =========================================================
   VIDEO ID
========================================================= */

function extractVideoId(url){

    try{

        const u = new URL(url);

        if(u.hostname.includes("youtu.be"))
            return u.pathname.substring(1);

        return u.searchParams.get("v") || "";

    }catch{

        return "";
    }
}


/* =========================================================
   CLOSE
========================================================= */

function closePlayer(){

    $("player").style.display = "none";

    $("iframe").src = "";

}


/* =========================================================
   DOWNLOAD
========================================================= */

async function downloadMedia(index,type){

    const item = currentResults[index];

    if(!item)
        return;

    const url =
        item.url ||
        item.link;

    if(!url)
        return;

    const title =
        item.title ||
        "Kyara Tube";

    const kind =
        type === "audio"
        ? "MP3"
        : "MP4";

    const box = $("download");

    box.style.display = "block";

    $("downloadTitle").textContent =
        `⬇️ Baixando ${kind}`;

    $("downloadText").textContent =
        title;

    $("progressBar").style.width = "5%";

    try{

        const response = await fetch(API_DOWNLOAD,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                url:url,

                type:type

            })

        });

        $("progressBar").style.width = "35%";

        if(!response.ok){

            let message =
                "Erro HTTP " + response.status;

            try{

                const err =
                    await response.json();

                message =
                    err.message ||
                    err.error ||
                    message;

            }catch{}

            throw new Error(message);
        }

        const blob =
            await response.blob();

        $("progressBar").style.width = "85%";

        if(!blob.size)
            throw new Error("Arquivo vazio");

        const objectURL =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = objectURL;

        a.download =
            safeFilename(title) +
            (type === "audio" ? ".mp3" : ".mp4");

        document.body.appendChild(a);

        a.click();

        a.remove();

        setTimeout(()=>{
            URL.revokeObjectURL(objectURL);
        },5000);

        $("progressBar").style.width = "100%";

        $("downloadText").textContent =
            `✅ ${kind} concluído — ${(blob.size/1024/1024).toFixed(1)} MB`;

        setTimeout(()=>{

            box.style.display = "none";

        },4000);

    }catch(error){

        console.error(error);

        $("progressBar").style.width = "0%";

        $("downloadText").textContent =
            "❌ " + error.message;

    }
}


/* =========================================================
   FILENAME
========================================================= */

function safeFilename(name){

    return String(name)
        .replace(/[\\/:*?"<>|]/g,"")
        .replace(/\s+/g," ")
        .trim()
        .substring(0,100)
        || "kyara-tube";
}


/* =========================================================
   HISTORY
========================================================= */

function saveHistory(item){

    try{

        let history =
            JSON.parse(
                localStorage.getItem("kyaraTubeHistory")
                || "[]"
            );

        history =
            history.filter(x =>
                x.url !== item.url
            );

        history.unshift(item);

        history =
            history.slice(0,30);

        localStorage.setItem(
            "kyaraTubeHistory",
            JSON.stringify(history)
        );

    }catch{}
}


function showHistory(){

    try{

        const history =
            JSON.parse(
                localStorage.getItem("kyaraTubeHistory")
                || "[]"
            );

        currentResults = history;

        renderResults(history);

    }catch{

        $("results").innerHTML =
            `<div class="empty">
                Histórico vazio.
            </div>`;
    }
}


/* =========================================================
   HOME
========================================================= */

function showHome(){

    $("channelBox").style.display = "none";

    $("results").innerHTML = `
        <div class="empty">

            <div style="font-size:55px">
                ▶️
            </div>

            <h2>Kyara Tube</h2>

            <p style="margin-top:8px;color:#777">
                Pesquise vídeos, assista e baixe em MP3 ou MP4.
            </p>

        </div>
    `;
}


/* =========================================================
   TRENDING
========================================================= */

function showTrending(){

    $("searchInput").value = "Minecraft";

    search();

}


/* =========================================================
   ENTER
========================================================= */

$("searchInput").addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter")
            search();

    }
);


/* =========================================================
   TESTE INICIAL
========================================================= */

console.log(
    "Kyara Tube conectado em:",
    API_BASE
);

</script>

</body>
</html>
